name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check branch name
        run: |
          set -euo pipefail

          branch_regex='^slice/[0-9]{4}(-[0-9]{4})*-[a-z0-9][a-z0-9-]*$'

          if [[ ! "${HEAD_REF}" =~ ${branch_regex} ]]; then
            echo "Branch name must match slice/<slice-ids>-<short-topic>." >&2
            echo "Example: slice/0026-0028-repo-workflow" >&2
            exit 1
          fi

      - name: Check PR body markers
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          printf '%s\n' "${PR_BODY}" > "${body_file}"

          required_markers=(
            '## Slice IDs'
            '## Branch Intent'
            '## Bundle Summary'
            '## Tests'
            '## CI Notes'
            '## Risk'
            '## Rollback'
          )

          for marker in "${required_markers[@]}"; do
            if ! grep -Fq "${marker}" "${body_file}"; then
              echo "Missing required PR body section: ${marker}" >&2
              exit 1
            fi
          done

          if ! grep -Eq '\b[0-9]{4}\b' "${body_file}"; then
            echo "PR body must list at least one four-digit slice ID." >&2
            exit 1
          fi

          if ! awk '
            /^## Tests$/ { in_tests=1; next }
            /^## / && in_tests { exit found ? 0 : 1 }
            in_tests && $0 !~ /^[[:space:]]*$/ { found=1 }
            END { exit found ? 0 : 1 }
          ' "${body_file}"; then
            echo "PR body must include test evidence under ## Tests." >&2
            exit 1
          fi
